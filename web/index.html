<!doctype html>
<html lang="id" data-layout="klasik">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Sholat Masjid</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/display.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body data-tema="zamrud">
<div id="bg" class="bg" hidden></div>
<!-- Bagian-bagian layar. js/display.js menyusunnya ke kerangka tata letak yang dipilih (Tampilan > Tata letak). -->
<div id="stage">

  <header class="top" id="partTop">
    <div class="identity">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 6c3 5 9 8 9 15 0 3-1 5-2 6h9v31H16V27h9c-1-1-2-3-2-6 0-7 6-10 9-15z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <path d="M26 58V44a6 6 0 0 1 12 0v14" fill="none" stroke="currentColor" stroke-width="3"/>
      </svg>
      <div>
        <h1 id="nama">Masjid</h1>
        <p id="alamat"></p>
      </div>
    </div>
    <div class="dates">
      <p id="masehi"></p>
      <p id="hijriah"></p>
    </div>
  </header>

  <main class="middle">
    <section class="clockwrap" id="partClock">
      <div class="analog" id="analog" hidden>
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="a-muka" cx="100" cy="100" r="96"/>
          <g class="a-tanda" id="aTanda"></g>
          <g id="aJam"><line x1="100" y1="112" x2="100" y2="52" class="a-jam"/></g>
          <g id="aMenit"><line x1="100" y1="116" x2="100" y2="28" class="a-menit"/></g>
          <g id="aDetik"><line x1="100" y1="122" x2="100" y2="20" class="a-detik"/></g>
          <circle cx="100" cy="100" r="5" class="a-pusat"/>
        </svg>
      </div>
      <div class="clock-isi">
        <div class="clock"><span id="hm">00:00</span><span id="ss">00</span></div>
        <p class="countdown" id="countdown"></p>
        <p class="acara" id="acara" hidden></p>
      </div>
    </section>

    <section class="media" id="media" hidden></section>

    <section class="panel" id="panel">
      <div class="slide" id="slide"></div>
      <div class="dots" id="dots"></div>
    </section>
  </main>

  <section class="times" id="times"></section>

  <footer class="ticker" id="partTicker">
    <div class="ticker-track"><div class="ticker-text" id="ticker"></div></div>
    <div class="admin-hint" id="adminHint"></div>
  </footer>
</div>

<!-- layar penuh: adzan / iqomah / sholat / jumat -->
<div id="overlay" class="overlay" hidden>
  <div class="ov-inner">
    <p class="ov-arab" id="ovArab"></p>
    <h2 class="ov-title" id="ovTitle"></h2>
    <div class="ov-big" id="ovBig"></div>
    <div class="ov-bar"><span id="ovBar"></span></div>
    <p class="ov-sub" id="ovSub"></p>
    <p class="ov-clock" id="ovClock"></p>
  </div>
</div>

<!-- pesan layar penuh dari server pusat (di bawah layar adzan/iqomah) -->
<div id="pusatPenuh" class="pusat-penuh" hidden></div>

<div id="dim" class="dim" hidden></div>

<script src="js/compat.js"></script>
<script src="js/praytime.js"></script>
<script src="js/jadwal.js"></script>
<script src="js/hijri.js"></script>
<script src="js/store.js"></script>
<script src="js/pusat.js"></script>
<script src="js/layout.js"></script>
<script src="js/display.js"></script>
</body>
</html>
