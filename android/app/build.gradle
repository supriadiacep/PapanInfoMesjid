plugins {
    id 'com.android.application'
}

android {
    namespace 'id.masjid.papaninfo'
    compileSdk 34

    defaultConfig {
        applicationId 'id.masjid.papaninfo'
        minSdk 21          // Android 5.0 ke atas: hampir semua STB/Android TV box
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Halaman web (layar & pengaturan) diambil langsung dari folder ../../web
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // ditandatangani dengan kunci debug agar langsung bisa dipasang
            // lewat flashdisk; ganti dengan kunci sendiri bila ingin rilis resmi
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
