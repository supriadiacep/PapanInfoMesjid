plugins {
    id 'com.android.application'
}

// Kunci tanda tangan rilis untuk Play Store. Diambil dari variabel lingkungan
// (GitHub Actions) atau dari file android/keystore.properties (Android Studio).
// Jika tidak ada, rilis ditandatangani kunci debug: tetap bisa dipasang lewat
// flashdisk, tapi tidak bisa diunggah ke Play Store.
def keyProps = new Properties()
def keyPropsFile = rootProject.file('keystore.properties')
if (keyPropsFile.exists()) keyPropsFile.withInputStream { keyProps.load(it) }
def keyValue = { String env, String prop -> System.getenv(env) ?: keyProps.getProperty(prop) }
def releaseStoreFile = keyValue('KEYSTORE_FILE', 'storeFile')

android {
    namespace 'id.masjid.papaninfo'
    compileSdk 36

    defaultConfig {
        applicationId 'id.masjid.papaninfo'
        minSdk 21          // Android 5.0 ke atas: hampir semua STB/Android TV box
        targetSdk 36       // syarat Play Store untuk aplikasi baru sejak 31 Agustus 2026
        // harus naik setiap kali mengunggah ke Play Store; di GitHub diisi otomatis
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.0'
    }

    // Halaman web (layar & pengaturan) diambil langsung dari folder ../../web
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword keyValue('KEYSTORE_PASSWORD', 'storePassword')
                keyAlias keyValue('KEY_ALIAS', 'keyAlias')
                keyPassword keyValue('KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseStoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
