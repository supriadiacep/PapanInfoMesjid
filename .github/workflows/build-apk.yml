# Membuat file APK otomatis di GitHub (gratis), tanpa perlu Android Studio.
# Setelah proyek diunggah ke GitHub, buka tab "Actions" -> "Build APK" -> unduh hasilnya.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # paket default 'tools' sudah dihapus dari SDK manager, jadi sebutkan sendiri
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk papan-info-masjid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: papan-info-masjid-apk
          path: papan-info-masjid.apk
