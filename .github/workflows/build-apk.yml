# Membuat file APK (dan AAB untuk Play Store) otomatis di GitHub (gratis), tanpa perlu Android Studio.
# Setelah proyek diunggah ke GitHub, buka tab "Actions" -> "Build APK" -> unduh hasilnya.
# File AAB hanya dibuat jika kunci tanda tangan sudah diisi di Settings -> Secrets (lihat README).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # nomor versi naik sendiri setiap kali workflow berjalan (syarat Play Store)
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # paket default 'tools' sudah dihapus dari SDK manager, jadi sebutkan sendiri
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pasang kunci tanda tangan
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Build AAB (Play Store)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: gradle bundleRelease --no-daemon

      - name: Peringatan tanpa kunci
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Secret KEYSTORE_BASE64 belum diisi. APK ditandatangani kunci debug dan file AAB untuk Play Store tidak dibuat."

      - name: Rename hasil
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk papan-info-masjid.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab papan-info-masjid.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: papan-info-masjid-apk
          path: papan-info-masjid.apk

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: papan-info-masjid-aab
          path: papan-info-masjid.aab
